name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # The headless OpenCV wheel needs no system libraries; tests need no YOLO weights.
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pyyaml imageio-ffmpeg pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          npm ci --prefix web
          pip install opencv-python-headless numpy pyyaml imageio-ffmpeg playwright
          pip install -e . --no-deps
          python -m playwright install --with-deps chromium
      - name: Unit tests (browser code in Node)
        run: npm test --prefix web
      - name: Build the site and run the demo in headless Chromium
        # No YOLO model here: the synthetic demo replays its recorded person boxes.
        run: |
          python web/build.py --out _site
          python web/e2e_test.py _site

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t escalator-monitor .
      - name: Smoke test the CLI inside the image
        run: |
          docker run --rm escalator-monitor sh -c "
            escalator-monitor synth /tmp/demo.mp4 --segments moving:3:2,stopped:4:3 &&
            escalator-monitor run --input /tmp/demo.mp4 --roi /tmp/demo.roi.json --headless \
              --detector replay:/tmp/demo.boxes.json --output-dir /tmp/out &&
            escalator-monitor evaluate /tmp/out/timeline.csv /tmp/demo.gt.csv"
