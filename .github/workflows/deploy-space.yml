name: Deploy Gradio app to Hugging Face

# Optional, run by hand: publishes the Python/Gradio app (app.py) to a Hugging
# Face Space. Gradio Spaces now need a Hugging Face PRO subscription; the free
# public demo is the in-browser site deployed by pages.yml.
# Setup: repository secret HF_TOKEN (write token) and optionally a variable
# HF_SPACE (user/space-name, default <your HF user>/escalator-monitor).

on:
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip without a token
        if: env.HF_TOKEN == ''
        run: echo "::notice::Add an HF_TOKEN repository secret to deploy the web demo to Hugging Face Spaces."

      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''

      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.11"

      - name: Assemble the Space
        if: env.HF_TOKEN != ''
        run: |
          mkdir space
          cp -r app.py escalator_monitor LICENSE space/
          if [ -d examples ]; then cp -r examples space/; fi
          cp deploy/huggingface/README.md deploy/huggingface/requirements.txt deploy/huggingface/packages.txt space/
          find space -name "__pycache__" -prune -exec rm -rf {} +

      - name: Upload
        if: env.HF_TOKEN != ''
        run: |
          pip install "huggingface_hub>=0.25"
          python deploy/huggingface/push_space.py space
